<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contact · Reman</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="mark" viewBox="0 0 200 200">
    <path d="M100 52 L142 76 L100 100 L58 76 Z" fill="#ffbe5c"/>
    <path d="M58 76 L100 100 L100 148 L58 124 Z" fill="#f5a524"/>
    <path d="M100 100 L142 76 L142 124 L100 148 Z" fill="#b8730a"/>
    <path d="M82.36 62.08 L124.36 86.08 L117.64 89.92 L75.64 65.92 Z" fill="#b8730a"/>
    <path d="M32.45 61 A78 78 0 1 1 43.89 154.18" fill="none" stroke="var(--logo-ink)" stroke-width="12" stroke-linecap="round"/>
    <path d="M25.82 135.48 L32.39 165.30 L55.39 143.06 Z" fill="var(--logo-ink)" stroke="var(--logo-ink)" stroke-width="3" stroke-linejoin="round"/>
  </symbol>
</svg>
<div class="page">
  <header class="bar">
    <a class="lockup small" href="./" aria-label="Reman home"><svg aria-hidden="true"><use href="#mark"/></svg><span class="rule"></span><span class="word">Reman</span></a>
    <div class="toggles"><button class="theme" type="button" aria-label="Switch between light and dark mode"><svg class="moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg><svg class="sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg></button></div>
  </header>
  <main class="doc">
    <div>

      <h1>Contact</h1>
      <p class="intro">For pricing, site visits and questions.</p>
      <form id="contact" novalidate>
        <div class="field"><label for="c-name">Name</label><input id="c-name" name="name" autocomplete="name"></div>
        <div class="field"><label for="c-email">Email</label><input id="c-email" name="email" type="email" autocomplete="email"></div>
        <div class="field full"><label for="c-org">Company</label><input id="c-org" name="org" autocomplete="organization"></div>
        <div class="field full"><label for="c-msg">Message</label><textarea id="c-msg" name="msg"></textarea></div>
        <button class="btn fill" type="submit">Send</button>
        <p class="msg" id="c-out" hidden role="status"></p>
      </form>
      <script>
      document.getElementById("contact").addEventListener("submit", e => {
        e.preventDefault();
        const f = e.target, out = document.getElementById("c-out");
        const ok = f.elements.name.value.trim() && /^\S+@\S+\.\S+$/.test(f.elements.email.value.trim());
        out.textContent = ok ? "This form is not connected yet. Nothing was sent." : "Enter your name and a valid email.";
        out.hidden = false;
      });
      </script>
    </div>
  </main>
  <footer class="foot"><span>© 2026 Reman</span><nav aria-label="Footer"><a href="./">Home</a><a href="product.html">Product</a><a href="contact.html">Contact</a></nav></footer>
</div>
<script src="site.js"></script>
</body>
</html>
